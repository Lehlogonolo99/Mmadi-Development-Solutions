# Runs the whole stack locally in containers against your Firebase project.
#
# Before the first run:
#   1. Save a Firebase service-account key as deploy/secrets/service-account.json
#   2. Save the web app config (Firebase console > Project settings > Your apps) as
#      deploy/firebase-web-config.json  (see deploy/firebase-web-config.example.json)
#   3. node scripts/sync-shared.mjs
# Then: docker compose up --build   and open http://localhost:8080

x-service: &service
  restart: unless-stopped
  environment: &service-env
    GOOGLE_CLOUD_PROJECT: mmadi-development-solutions
    GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
    PORT: "8080"
  volumes:
    - ./deploy/secrets/service-account.json:/secrets/service-account.json:ro
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3

services:
  repairs:
    <<: *service
    build: services/repairs
  cafe:
    <<: *service
    build: services/cafe
  learnerships:
    <<: *service
    build: services/learnerships
  contact:
    <<: *service
    build: services/contact
  staff:
    <<: *service
    build: services/staff
    environment:
      <<: *service-env
      OWNER_EMAIL: 216812190hlogi@gmail.com
      PORTAL_URL: http://localhost:8080/portal/

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    volumes:
      - ./deploy/firebase-web-config.json:/usr/share/nginx/html/__/firebase/init.json:ro

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on: [web, repairs, cafe, learnerships, contact, staff]
