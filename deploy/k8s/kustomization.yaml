# Apply with:  kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mmadi
resources:
  - namespace.yaml
  - config.yaml
  - services.yaml
  - web.yaml
  - ingress.yaml
# Point these at your registry and tag, e.g. ghcr.io/lehlogonolo99/mmadi-repairs:1.0.0
images:
  - { name: mmadi/repairs-service, newName: ghcr.io/lehlogonolo99/mmadi-repairs, newTag: latest }
  - { name: mmadi/cafe-service, newName: ghcr.io/lehlogonolo99/mmadi-cafe, newTag: latest }
  - { name: mmadi/learnerships-service, newName: ghcr.io/lehlogonolo99/mmadi-learnerships, newTag: latest }
  - { name: mmadi/contact-service, newName: ghcr.io/lehlogonolo99/mmadi-contact, newTag: latest }
  - { name: mmadi/staff-service, newName: ghcr.io/lehlogonolo99/mmadi-staff, newTag: latest }
  - { name: mmadi/web, newName: ghcr.io/lehlogonolo99/mmadi-web, newTag: latest }
