# Local gateway for docker-compose: one origin for the site and all APIs,
# mirroring the Firebase Hosting rewrites and the Kubernetes Ingress.
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 64k;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/repairs/      { proxy_pass http://repairs:8080; }
  location /api/cafe/         { proxy_pass http://cafe:8080; }
  location /api/learnerships/ { proxy_pass http://learnerships:8080; }
  location /api/contact/      { proxy_pass http://contact:8080; }
  location /api/staff/        { proxy_pass http://staff:8080; }
  location /api/              { return 404; }

  location / { proxy_pass http://web:8080; }
}
