# Serves public/ the way Firebase Hosting does (clean URLs, trailing slashes, custom 404).
# API routing (/api/<service>) is done in front of this container: by the Ingress in Kubernetes,
# or by the gateway container in docker-compose.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /assets/ {
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /portal/ {
    add_header X-Robots-Tag noindex always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
  }

  location = /__/firebase/init.json {
    add_header Cache-Control no-store always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
